<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B45"/>
      <stop offset="100%" stop-color="#1F3C5F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6A85F"/>
      <stop offset="100%" stop-color="#C4964D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Architectural Silhouette -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="150" y="160" width="500" height="380" rx="4"/>
    <line x1="150" y1="250" x2="650" y2="250"/>
    <line x1="150" y1="340" x2="650" y2="340"/>
    <line x1="150" y1="430" x2="650" y2="430"/>
    <!-- Windows -->
    <rect x="190" y="190" width="50" height="40" rx="2"/>
    <rect x="280" y="190" width="50" height="40" rx="2"/>
    <rect x="375" y="190" width="50" height="40" rx="2"/>
    <rect x="470" y="190" width="50" height="40" rx="2"/>
    <rect x="560" y="190" width="50" height="40" rx="2"/>
    
    <rect x="190" y="280" width="50" height="40" rx="2"/>
    <rect x="280" y="280" width="50" height="40" rx="2"/>
    <rect x="375" y="280" width="50" height="40" rx="2"/>
    <rect x="470" y="280" width="50" height="40" rx="2"/>
    <rect x="560" y="280" width="50" height="40" rx="2"/>

    <rect x="190" y="370" width="50" height="40" rx="2"/>
    <rect x="280" y="370" width="50" height="40" rx="2"/>
    <rect x="375" y="370" width="50" height="40" rx="2"/>
    <rect x="470" y="370" width="50" height="40" rx="2"/>
    <rect x="560" y="370" width="50" height="40" rx="2"/>
  </g>

  <!-- Central Badge & Typography -->
  <g text-anchor="middle">
    <rect x="360" y="70" width="80" height="80" rx="16" fill="url(#gold)"/>
    <text x="400" y="122" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#142B45">VGH</text>
    
    <text x="400" y="270" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" letter-spacing="1">VARAHI GIRLS HOSTEL</text>
    <text x="400" y="305" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#D6A85F" letter-spacing="3">BRANCH 1 • HIGH SECURITY WOMEN ENCLAVE</text>
    <text x="400" y="340" font-family="sans-serif" font-size="13" fill="#E5E0D7" opacity="0.8">Near RGIA Airport Hub &amp; College Corridor • Shamshabad, Hyderabad</text>

    <!-- Badges -->
    <rect x="240" y="470" width="140" height="36" rx="6" fill="#1F3C5F" stroke="#D6A85F" stroke-width="1"/>
    <text x="310" y="493" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#D6A85F">LADY WARDEN 24/7</text>

    <rect x="420" y="470" width="140" height="36" rx="6" fill="#1F3C5F" stroke="#D6A85F" stroke-width="1"/>
    <text x="490" y="493" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#D6A85F">CCTV &amp; HOT WATER</text>
  </g>
</svg>
